name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Developer Git hook installation is unnecessary for build and test jobs.
  npm_config_ignore_scripts: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
  Test:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [16.x, 14.x, 12.x]
        include:
          - os: ubuntu-latest
            node: 22.x
            coverage: true
          - os: ubuntu-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # AVA 5 requires Node >=14.19; AVA 4 runs the same tests on Node 12.
      - run: npm install --no-save --package-lock=false --ignore-scripts ava@4.3.3
        if: matrix.node == '12.x'
      - run: npm run build
      - run: npm test
        if: ${{ !matrix.coverage }}
      - run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text npm test
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
