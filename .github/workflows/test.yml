name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22.x, 24.x, 26.x]
        include:
          - os: macos-latest
            node: 24.x
          - os: windows-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
