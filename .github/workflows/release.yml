# npm Trusted Publisher: gjbkz/gulp-fun, release.yml, environment: deployment.
# Release and recovery: https://github.com/nlibjs/actions#release-procedure
# Shared release tooling uses Node 26; consumer support remains Node >=22.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [verify, stage]
        default: verify
        required: true
      tag:
        description: "Published Release tag for retry, e.g. v1.2.3"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  Verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    permissions:
      contents: read
    uses: nlibjs/actions/.github/workflows/npm-release.yml@f965d0820e389c43df3e383a8113e42baa036cb3
    with:
      action: verify
  Stage:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.action == 'stage'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: nlibjs/actions/.github/workflows/npm-release.yml@f965d0820e389c43df3e383a8113e42baa036cb3
    with:
      action: stage
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      environment: deployment
